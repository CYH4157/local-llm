# =============================================================================
#  llama-swap 設定：依 request 的 "model" 名稱自動啟動 / 切換 vLLM
#
#  • 這裡的 key（qwen3-8b …）就是 Discord 裡 `!model <名稱>` 用的名字
#  • 8GB 顯卡一次只放得下一個模型 → 切換時 llama-swap 會先關掉舊的再開新的
#  • ttl：閒置多少秒後自動卸載，把 GPU 還給筆電（偶爾使用的情境很適合）
#  • 改完此檔：sudo systemctl restart llama-swap
#
#  顯存不夠（OOM、"No available memory for the cache blocks"、
#  "max_model_len ... larger than the maximum number of tokens in KV cache"）依序嘗試：
#    1. 調小 --max-model-len（如 6144 → 4096）
#    2. --gpu-memory-utilization 0.92 → 0.88（Windows 桌面也可能吃一點顯存）
#    3. 換更小的模型
# =============================================================================

healthCheckTimeout: 900      # 第一次要下載模型 + 編譯，給足時間
logLevel: info
startPort: 10001

# API 金鑰：服務只聽本機，金鑰是多一層保護
# 金鑰本身不寫在這裡，由 systemd 從 ~/llm/llama-swap.env 帶入
# （deploy.ps1 會把 Windows 端 .env 的 LLM_API_KEY 同步過去）
apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # 所有模型共用的 vLLM 參數（8GB 筆電 GPU 調校）
  #   --enforce-eager   不建 CUDA graph：啟動快、省顯存（小量使用時速度差異不大）
  #   --max-num-seqs 4  同時最多處理 4 個請求（6 人偶爾用足夠）
  "vllm-args": >-
    --host 127.0.0.1
    --port ${PORT}
    --gpu-memory-utilization 0.92
    --enforce-eager
    --max-num-seqs 4

models:
  "qwen3-8b":
    name: "Qwen3 8B (AWQ)"
    description: "預設：寫作品質最好，上下文 6k"
    # 8B 的權重約 6GB，8GB 顯卡剩給上下文的空間不多 → 6144
    cmd: |
      vllm serve Qwen/Qwen3-8B-AWQ
      ${vllm-args}
      --served-model-name qwen3-8b
      --max-model-len 6144
    ttl: 1800
    filters:
      setParams:
        # 關閉 Qwen3 的「思考模式」，日常任務回應快很多
        chat_template_kwargs:
          enable_thinking: false

  "qwen3-4b":
    name: "Qwen3 4B Instruct 2507 (FP8)"
    description: "速度快、上下文 12k，適合長文件摘要 / 附檔產報告"
    cmd: |
      vllm serve Qwen/Qwen3-4B-Instruct-2507-FP8
      ${vllm-args}
      --served-model-name qwen3-4b
      --max-model-len 12288
    ttl: 1800

  "qwen2.5-7b":
    name: "Qwen2.5 7B Instruct (AWQ)"
    description: "備用：較舊但穩定，上下文 8k"
    cmd: |
      vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ
      ${vllm-args}
      --served-model-name qwen2.5-7b
      --max-model-len 8192
    ttl: 1800
